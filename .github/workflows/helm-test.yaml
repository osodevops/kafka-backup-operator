name: Helm Chart Test

permissions:
  contents: read

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile'
      - 'deploy/helm/kafka-backup-operator/**'
      - 'deploy/crds/**'
      - 'scripts/e2e/**'
      - 'scripts/test_gcs_auth_admission.py'
      - '.github/workflows/helm-test.yaml'

jobs:
  helm-lint:
    name: Helm Lint & Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.14.4

      - name: Helm lint
        run: helm lint deploy/helm/kafka-backup-operator

      - name: Helm template (default values)
        run: helm template test-release deploy/helm/kafka-backup-operator > /dev/null

      - name: Helm template (azure workload identity)
        run: |
          helm template test-release deploy/helm/kafka-backup-operator \
            --set azureWorkloadIdentity.enabled=true \
            --set azureWorkloadIdentity.clientId=test-client-id > /dev/null

      - name: Helm template (defaults never run two operator pods, issue #79)
        run: |
          helm template test-release deploy/helm/kafka-backup-operator | tee /tmp/kbo-default.yaml > /dev/null
          grep -q 'type: RollingUpdate' /tmp/kbo-default.yaml
          grep -q 'maxSurge: 0' /tmp/kbo-default.yaml
          grep -q 'maxUnavailable: 1' /tmp/kbo-default.yaml
          grep -q 'name: LEADER_ELECTION_ENABLED' /tmp/kbo-default.yaml
          grep -q 'name: LEADER_ELECTION_LEASE_NAME' /tmp/kbo-default.yaml
          grep -q 'value: "test-release-kafka-backup-operator-leader"' /tmp/kbo-default.yaml
          grep -q 'value: "15s"' /tmp/kbo-default.yaml
          grep -q 'coordination.k8s.io' /tmp/kbo-default.yaml
          grep -q 'terminationGracePeriodSeconds: 60' /tmp/kbo-default.yaml

      - name: Helm template (leader election off, Recreate)
        run: |
          helm template test-release deploy/helm/kafka-backup-operator \
            --set leaderElection.enabled=false --set updateStrategy.type=Recreate | tee /tmp/kbo-optout.yaml > /dev/null
          grep -q 'type: Recreate' /tmp/kbo-optout.yaml
          if grep -Eq 'maxSurge|LEADER_ELECTION_ENABLED|coordination.k8s.io' /tmp/kbo-optout.yaml; then
            echo 'Unexpected rolling update or leader-election settings'
            exit 1
          fi

      - name: Helm template (service monitor)
        run: |
          helm template test-release deploy/helm/kafka-backup-operator \
            --set metrics.serviceMonitor.enabled=true > /dev/null

  helm-install:
    name: Helm Install (kind)
    runs-on: ubuntu-latest
    needs: helm-lint
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Build operator image locally
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          load: true
          tags: kafka-backup-operator:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.14.4

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: chart-test

      - name: Load image into kind
        run: bash scripts/e2e/load-kind-images.sh chart-test kafka-backup-operator:ci-test

      - name: Helm install
        run: |
          helm install kafka-backup-operator deploy/helm/kafka-backup-operator \
            --set image.repository=kafka-backup-operator \
            --set image.tag=ci-test \
            --set image.pullPolicy=IfNotPresent \
            --wait --timeout 3m

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/kafka-backup-operator --timeout=60s
          kubectl get pods -l app.kubernetes.io/name=kafka-backup-operator

      - name: Verify previous release upgrade and rollback with Kafka
        run: |
          helm uninstall kafka-backup-operator --wait
          kind get kubeconfig --name chart-test > /tmp/kbo-upgrade.kubeconfig
          KUBECONFIG=/tmp/kbo-upgrade.kubeconfig \
            python3 scripts/test_gcs_auth_admission.py --context kind-chart-test
          docker pull ghcr.io/osodevops/kafka-backup-operator:1.9.1
          docker pull apache/kafka:4.1.1
          bash scripts/e2e/load-kind-images.sh chart-test ghcr.io/osodevops/kafka-backup-operator:1.9.1 apache/kafka:4.1.1
          python3 scripts/e2e/upgrade-compatibility.py \
            --kubeconfig /tmp/kbo-upgrade.kubeconfig --context kind-chart-test \
            --image kafka-backup-operator:ci-test --evidence .e2e/upgrade

      - name: Upload upgrade evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upgrade-compatibility
          path: .e2e/upgrade
          if-no-files-found: ignore

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          echo "=== Pods ==="
          kubectl get pods -A -o wide
          echo "=== Describe operator pods ==="
          kubectl describe pods -l app.kubernetes.io/name=kafka-backup-operator
          echo "=== Operator logs ==="
          kubectl logs -l app.kubernetes.io/name=kafka-backup-operator --tail=200 --all-containers=true || true
          echo "=== Events ==="
          kubectl get events --sort-by=.lastTimestamp -A

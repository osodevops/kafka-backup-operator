apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: confluent
resources:
  - ../test
  - extra-topics.yaml
patches:
  # The default one-shot KafkaBackup is replaced by the excludeTopics cases.
  - patch: |
      $patch: delete
      apiVersion: kafka.oso.sh/v1alpha1
      kind: KafkaBackup
      metadata:
        name: backup-test-topic
        namespace: confluent

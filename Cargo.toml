[package]
name = "kafka-backup-operator"
version = "1.9.2"
edition = "2021"
authors = ["OSO DevOps <dev@oso.sh>"]
description = "Kubernetes Operator for OSO Kafka Backup"
license = "MIT"
repository = "https://github.com/osodevops/kafka-backup-operator"
readme = "README.md"
keywords = ["kubernetes", "operator", "kafka", "backup", "disaster-recovery"]
categories = ["command-line-utilities"]

[dependencies]
# Core backup library
kafka-backup-core = "0.30.2"

# Kubernetes
kube = { version = "5.1.0", features = ["runtime", "derive", "client"] }
kube-runtime = "5.1.0"
k8s-openapi = { version = "0.29.0", features = ["v1_33"] }

# Async runtime
tokio = { version = "1.54.1", features = ["full", "signal"] }
tokio-util = "0.7.20"
futures = "0.3.34"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde-saphyr = "2.2.0"

# Time
chrono = { version = "0.4.45", features = ["serde"] }
schemars = { version = "1.2.3", features = ["chrono04"] }
cron = "0.17.0"

# Logging & Tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-appender = "0.2.5"

# Error handling
anyhow = "1.0.104"
thiserror = "2.0.21"

# HTTP client (for validation webhooks/notifications)
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls",
] }

# TLS: pins the process-default crypto provider (see `install_crypto_provider`)
rustls = { version = "0.23.46", default-features = false, features = [
  "ring",
  "std",
] }

# Metrics
prometheus = "0.14.0"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"

# Schema generation (moved to Time section with chrono feature)

# Lazy static for metrics
lazy_static = "1.5.1"
libc = "0.2.191"

# Private temporary file for the evidence signing key (core reads keys from a path)
tempfile = "3.27.0"

[[bin]]
name = "kafka-backup-operator"
path = "src/main.rs"

[[bin]]
name = "crdgen"
path = "src/bin/crdgen.rs"

[dev-dependencies]
tokio-test = "0.4.6"
tower-test = "0.4.0"
http = "1.5.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

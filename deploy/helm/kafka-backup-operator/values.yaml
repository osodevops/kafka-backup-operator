# Default values for kafka-backup-operator

# Number of replicas
replicaCount: 1

# Deployment update strategy. The default never schedules two operator pods
# at once (maxSurge 0 / maxUnavailable 1): the outgoing pod is deleted before
# its replacement is created, and while it drains (finishing a running backup)
# the leader lease keeps it the only one executing schedules (issue #79).
# `type: Recreate` additionally waits for the old pod to be fully gone, but an
# existing release managed with server-side apply (Helm 4) cannot switch to it
# in place: the API-defaulted rollingUpdate block is forbidden with Recreate.
# Use Recreate on fresh installs, or first run
# `kubectl patch deploy <release> --type=json -p '[{"op":"remove","path":"/spec/strategy/rollingUpdate"}]'`.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

# How long a stopping pod may take to finish its work: a running backup is
# asked to stop (it checkpoints and finalizes) before the leader lease is
# released.
terminationGracePeriodSeconds: 60

image:
  repository: ghcr.io/osodevops/kafka-backup-operator
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  # For Azure Workload Identity, add:
  #   azure.workload.identity/client-id: "<managed-identity-client-id>"
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# Azure Workload Identity configuration
# When enabled, the operator can authenticate to Azure services using federated identity tokens
# instead of storing credentials in Kubernetes secrets
azureWorkloadIdentity:
  # Enable Azure Workload Identity support
  enabled: false
  # The client ID of the Azure Managed Identity
  # This should match the identity federated with this service account
  clientId: ""

# Pod annotations
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Metrics service configuration
service:
  type: ClusterIP
  port: 8080
  annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector:
  kubernetes.io/os: linux

tolerations: []

affinity: {}

# Extra pod volumes to mount into the operator pod
extraVolumes: []

# Extra volume mounts for the operator container
extraVolumeMounts: []

# Extra environment variables for the operator container
extraEnv: []

# Logging configuration
logging:
  level: "info,kafka_backup_operator=debug"
  format: json

# Metrics configuration
metrics:
  enabled: true
  # Cap on the number of distinct topic/partition label sets the
  # kafka-backup-core runtime metrics may expose, guarding the endpoint against
  # cardinality blow-ups. Set to 0 for no cap.
  maxPartitionLabels: 100
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

# CRD installation
crds:
  # Install CRDs with the chart
  install: true
  # Keep CRDs on chart uninstall
  keep: true

# Leader election. Only the replica holding the Lease
# `<release fullname>-leader` (coordination.k8s.io, in the operator namespace)
# runs the controllers and executes schedules; the others stand by and report
# `standby` on /readyz. Prevents two operator pods (rollout, node drain,
# eviction, replicaCount > 1) from running the same KafkaBackup at once.
# Requires the leases RBAC rule the chart renders when enabled; set to false
# to opt out.
leaderElection:
  enabled: true
  leaseDuration: 15s   # how long a standby waits without seeing a change before taking over
  renewDeadline: 10s   # how long the leader keeps retrying renewals before it exits (and restarts)
  retryPeriod: 2s      # interval between acquire/renew attempts; must be < renewDeadline < leaseDuration
